name: Build docker image

on:
  workflow_call:
    inputs:
      tags:
        description: "Comma or newline separated list of tags"
        required: true
        type: string
      version:
        type: string
        description: "Version tag"
        required: true
      sha:
        type: string
        default: "Commit sha"
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    name: Push docker image
    timeout-minutes: 10
    env:
      CONTAINER_NAME: voice-to-speech-app
      CONTAINER_REGISTRY: ghcr.io
      APP_VERSION_SHA: ${{ inputs.sha }}
    steps:
      - name: App version
        run: echo "Picked the app version $APP_VERSION_SHA"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      #      - name: Install Python
      #        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      #        with:
      #          python-version: "3.12"

      #      Probably dont need anymore
      #      - name: Download AI model
      #        run: pip install gdown && gdown ${{ secrets.WHISPER_MODEL_URL }} -O ./model-cache

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Calculate docker tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        env:
          CONTAINER_PATH: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}/${{ env.CONTAINER_NAME }}
        with:
          images: ${{ env.CONTAINER_PATH }}
          tags: ${{ inputs.tags }}

      - name: Publish to Registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ inputs.version }}

      - name: Add image reference
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT_SHA: ${{ inputs.sha }}
          PRIMARY_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        with:
          script: |
            const { COMMIT_SHA: sha, PRIMARY_TAG: tag, CONTAINER_NAME: container } = process.env
            const { owner, repo } = context.repo;
            const target_url = `https://github.com/${owner}/${repo}/pkgs/container/${encodeURIComponent(`${repo}/${container}`)}`
            const description = `${container}:${tag.split(':').pop()}`;
            const api = `/repos/${owner}/${repo}/statuses/${sha}`;

            await github.request(`POST ${api}`, {
              owner,
              repo,
              sha,
              target_url,
              state: 'success',
              description,
              context: 'Docker image'
            });
